name: pipeline
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
        
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      
      - run: pip install semgrep
      # CORRECCIÓN: Cambio de "auto" a "p/javascript"
      - run: semgrep scan --config p/javascript --error
      
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- RETO EXTRA 2: Trivy (Escaneo del contenedor) ---
      - run: docker run --rm -v "$PWD":/src aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /src

      # --- RETO EXTRA 3: OWASP ZAP (Prueba en ejecución) ---
      - run: node app.js &
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
